# Host ports are deliberately offset from this machine's other two Spring/BFF
# stacks (clinic-management-saas, bus-ticketing-saas), which both use the
# conventional :80/:3000/:5432/:6379/:8080/:8081 - so all three can run at
# the same time. Container-to-container traffic is unaffected either way
# (everything talks over the docker network by service name).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bidmgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidmgmt}
      # bidmgmt_test is for ImportServiceLiveFilesTest (spring-boot-api) -
      # a real Postgres-backed test separate from the "bidmgmt" database the
      # app itself (and SeedDataRunner) uses, so running `mvn test` locally
      # against this same compose Postgres never collides with real/seeded data.
      POSTGRES_MULTIPLE_DATABASES: bidmgmt,bidmgmt_test,keycloak
    volumes:
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidmgmt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-bidmgmt}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-bidmgmt}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  spring-boot-api:
    build: ./spring-boot-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bidmgmt
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bidmgmt}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bidmgmt}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/bidmgmt
      # The `iss` claim tokens actually carry - see node-bff/src/auth/oidc.js's
      # comment for the full explanation (Keycloak pins `iss` to whatever host
      # the browser used against the authorize endpoint, not this internal one).
      KEYCLOAK_ISSUER_PUBLIC_URI: http://localhost:8090/realms/bidmgmt
      BIDMGMT_UPLOADS_ROOT: /app/uploads
      BIDMGMT_SEED_UPCOMING: /app/seed-data/upcoming-bids.xlsx
      BIDMGMT_SEED_TRACKER: /app/seed-data/bids-tracker.xlsx
    volumes:
      - uploads_data:/app/uploads
      - ./docs/Upcoming Bid Oct 07.xlsx:/app/seed-data/upcoming-bids.xlsx:ro
      - ./docs/on hand bid.xlsx:/app/seed-data/bids-tracker.xlsx:ro
    ports:
      - "8091:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  node-bff:
    build: ./node-bff
    environment:
      PORT: 3000
      API_BASE_URL: http://spring-boot-api:8081
      REDIS_URL: redis://redis:6379
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/bidmgmt
      KEYCLOAK_ISSUER_PUBLIC: http://localhost:8090/realms/bidmgmt
      KEYCLOAK_CLIENT_ID: bidmgmt-bff
      KEYCLOAK_CLIENT_SECRET: ${BFF_CLIENT_SECRET:-changeme-in-keycloak-console}
      SESSION_SECRET: ${SESSION_SECRET:-changeme-long-random-string}
      BFF_BASE_URL: http://localhost:3002
    ports:
      - "3002:3000"
    depends_on:
      spring-boot-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "82:80"
    depends_on:
      node-bff:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  uploads_data:
