server:
  port: 8081

spring:
  application:
    name: bidmgmt-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/bidmgmt}
    username: ${SPRING_DATASOURCE_USERNAME:bidmgmt}
    password: ${SPRING_DATASOURCE_PASSWORD:bidmgmt}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    time-zone: Africa/Addis_Ababa
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
      # Mailpit (local dev) and many on-prem relays don't speak TLS at all -
      # without this, Spring's default auto-config still tries STARTTLS
      # opportunistically against a plaintext server and the connection hangs.
      mail.smtp.ssl.trust: ${MAIL_SMTP_SSL_TRUST:}

bidmgmt:
  uploads-root: ${BIDMGMT_UPLOADS_ROOT:./uploads}
  timezone: Africa/Addis_Ababa
  seed:
    enabled: ${BIDMGMT_SEED_ENABLED:true}
    upcoming-file: "${BIDMGMT_SEED_UPCOMING:../docs/Upcoming Bid Oct 07.xlsx}"
    tracker-file: "${BIDMGMT_SEED_TRACKER:../docs/on hand bid.xlsx}"
  notifications:
    enabled: ${BIDMGMT_NOTIFICATIONS_ENABLED:true}
    from-address: ${BIDMGMT_NOTIFICATIONS_FROM:bidmgmt@motiengineering.com}
    director-email: ${BIDMGMT_DIRECTOR_EMAIL:mengistu.redae@motiengineering.com}
    app-base-url: ${BIDMGMT_APP_BASE_URL:http://localhost:3002}
    # Cron is Africa/Addis_Ababa local time regardless of the container's own
    # timezone - see ReminderSchedulerService.
    reminder-cron: ${BIDMGMT_REMINDER_CRON:0 0 7 * * *}
  # Internal (container-to-container) issuer used for the JWT decoder's own
  # server-to-server calls (JWK set fetch, issuer validation base), vs the
  # public one the browser's token actually carries in its `iss` claim - see
  # node-bff/src/auth/oidc.js's comment for why these two differ under
  # Keycloak's KC_HOSTNAME_STRICT=false. Both point at the same realm.
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/bidmgmt}
    issuer-public-uri: ${KEYCLOAK_ISSUER_PUBLIC_URI:http://localhost:8090/realms/bidmgmt}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.motiengineering.bidmgmt: INFO
