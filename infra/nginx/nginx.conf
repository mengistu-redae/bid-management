events {
  worker_connections 1024;
}

http {
  # Route everything to the Node BFF by default - the browser never talks to
  # Keycloak or the Spring Boot API directly. The BFF holds the session and
  # forwards bearer tokens to the API on the server side.
  upstream bff {
    server node-bff:3000;
  }

  # Exposed only for local development so an admin can reach the Keycloak
  # admin console at /keycloak/ - remove or lock this down before going
  # further than a single-VM pilot.
  upstream keycloak {
    server keycloak:8080;
  }

  client_max_body_size 25m;

  # HTTPS - the TLS cert is self-signed and generated on first start (see
  # docker-compose.yml's nginx `command`), good enough to exercise HTTPS
  # locally but not for a real deployment: browsers will warn on it. Swap in
  # a real certificate (e.g. via certbot/Let's Encrypt) by replacing the two
  # files under infra/nginx/tls/ - see DEPLOYMENT.md.
  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    location /keycloak/ {
      proxy_pass http://keycloak/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://bff;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }
  }

  # Plain HTTP - kept serving (not redirected to HTTPS) so the existing local
  # dev workflow at http://localhost:82 keeps working without every browser
  # needing to trust the self-signed cert first. For a real deployment,
  # replace this server block's locations with a `return 301 https://$host$request_uri;`
  # once a real certificate is in place - see DEPLOYMENT.md's TLS section.
  server {
    listen 80;

    location /keycloak/ {
      proxy_pass http://keycloak/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://bff;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }
  }
}
